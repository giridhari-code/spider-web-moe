# Set model.vocab_size to the actual value printed by train_custom_tokenizer.py.
model:
  vocab_size: 8192
  hidden_size: 128
  num_heads: 4
  num_experts: 4
  top_k: 2
  edges_per_expert: 2
  num_loops: 2
  num_prelude_layers: 1
  num_coda_layers: 1
  expert_ffn_size: 256
  loop_embed_size: 16
  residual_scale: 0.5
  re_inject_weight: 0.1
  early_exit_threshold: 0.85
  dropout: 0.0
  embedding_init_std: 0.02
  max_seq_len: 256
stages:
  pretrain:
    enabled: true
    batch_size: 2
    seq_len: 256
    steps: 2000
    learning_rate: 0.0003
    weight_decay: 0.1
    grad_clip: 1.0
    warmup_steps: 100
    min_lr_ratio: 0.1
    aux_loss_weight: 0.01
    edge_loss_weight: 0.01
    log_every: 10
    save_every: 250
    eval_every: 100
    eval_batches: 20
    grad_accum: 8
    precision: auto
    seed: 1337
    dataset_format: uint32
    data_path: data/wikipedia_tokens/train.bin
    validation_path: data/wikipedia_tokens/validation.bin
    checkpoint_dir: checkpoints/wikipedia-pretrain
