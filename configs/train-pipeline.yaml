# End-to-end staged recipe. Set each data_path to pre-tokenized files.
# pretrain/midtrain: uint32 token stream. SFT: JSONL input_ids + labels.
# DPO: JSONL prompt_ids + chosen_ids + rejected_ids.
model:
  vocab_size: 32000
  hidden_size: 256
  num_heads: 8
  num_experts: 8
  top_k: 2
  edges_per_expert: 3
  num_loops: 4
  num_prelude_layers: 1
  num_coda_layers: 1
  expert_ffn_size: 1024
  loop_embed_size: 32
  residual_scale: 0.5
  re_inject_weight: 0.1
  early_exit_threshold: 0.85
  dropout: 0.0
  max_seq_len: 1024
stages:
  pretrain:
    enabled: true
    data_path: data/tokenized/pretrain/train.bin
    validation_path: data/tokenized/pretrain/val.bin
    dataset_format: uint32
    checkpoint_dir: checkpoints/pretrain
    batch_size: 4
    seq_len: 512
    steps: 1000
    grad_accum: 4
    learning_rate: 0.0003
    warmup_steps: 100
    min_lr_ratio: 0.1
    weight_decay: 0.1
    grad_clip: 1.0
    aux_loss_weight: 0.01
    edge_loss_weight: 0.01
    precision: auto
    log_every: 10
    eval_every: 250
    eval_batches: 8
    save_every: 500
    seed: 42
  midtrain:
    enabled: false
    data_path: data/tokenized/domain/train.bin
    validation_path: data/tokenized/domain/val.bin
    dataset_format: uint32
    checkpoint_dir: checkpoints/midtrain
    batch_size: 4
    seq_len: 512
    steps: 500
    grad_accum: 4
    learning_rate: 0.00005
    warmup_steps: 50
    min_lr_ratio: 0.1
    weight_decay: 0.05
    grad_clip: 1.0
    aux_loss_weight: 0.01
    edge_loss_weight: 0.01
    precision: auto
    log_every: 10
    eval_every: 250
    eval_batches: 8
    save_every: 250
    seed: 43
  sft:
    enabled: false
    data_path: data/sft/train.jsonl
    validation_path: data/sft/val.jsonl
    dataset_format: sft_jsonl
    checkpoint_dir: checkpoints/sft
    batch_size: 2
    seq_len: 768
    steps: 500
    grad_accum: 4
    learning_rate: 0.00005
    warmup_steps: 50
    min_lr_ratio: 0.1
    weight_decay: 0.05
    grad_clip: 1.0
    aux_loss_weight: 0.005
    edge_loss_weight: 0.005
    precision: auto
    log_every: 10
    eval_every: 100
    eval_batches: 8
    save_every: 250
    seed: 44
  dpo:
    enabled: false
    data_path: data/preferences/train.jsonl
    reference_checkpoint: checkpoints/sft/best.pt
    checkpoint_dir: checkpoints/dpo
    batch_size: 1
    seq_len: 768
    steps: 250
    grad_accum: 4
    learning_rate: 0.000005
    warmup_steps: 20
    min_lr_ratio: 0.1
    weight_decay: 0.0
    grad_clip: 1.0
    beta: 0.1
    precision: auto
    log_every: 5
    save_every: 100
    seed: 45
